spring.application.name=contribution-planner

# Defaults point to the Postgres in docker-compose.yml; set DB_URL, DB_USERNAME and DB_PASSWORD in production.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/contribution_planner}
spring.datasource.username=${DB_USERNAME:contribution_planner}
spring.datasource.password=${DB_PASSWORD:contribution_planner}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Reject 12.5 in an integer field instead of truncating it to 12.
spring.jackson.deserialization.accept-float-as-int=false

management.endpoints.web.exposure.include=health
