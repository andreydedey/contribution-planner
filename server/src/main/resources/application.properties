spring.application.name=contribution-planner

# Em dev, os valores padrão apontam para o Postgres do docker-compose.yml.
# Em produção, defina DB_URL, DB_USERNAME e DB_PASSWORD no ambiente.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/contribution_planner}
spring.datasource.username=${DB_USERNAME:contribution_planner}
spring.datasource.password=${DB_PASSWORD:contribution_planner}

# O schema é do Flyway; o Hibernate só confere se as entidades batem com ele.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 12.5 num campo inteiro (ex.: meta) é recusado em vez de virar 12 (AC-053).
spring.jackson.deserialization.accept-float-as-int=false

management.endpoints.web.exposure.include=health
