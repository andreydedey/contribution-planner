services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: contribution_planner
      POSTGRES_USER: contribution_planner
      POSTGRES_PASSWORD: contribution_planner
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contribution_planner -d contribution_planner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
